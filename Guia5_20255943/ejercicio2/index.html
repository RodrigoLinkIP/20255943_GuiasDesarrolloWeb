<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/productos.js" defer></script>
    <title>Gestión de Pedidos</title>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark mb-4 pt-4 pb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Consola de administración de pedidos</span>
        </div>
    </nav>
    <main class="container my-5">
        <form id="form-pedido">
            <div class="mb-3 mt-3">
                <label for="nombre" class="form-label">Nombre del Producto:</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ingresar producto" name="nombre"
                    required>
                <div class="invalid-feedback" id="error-nombre"></div>
            </div>
            <div class="mb-3">
                <label for="precio" class="form-label">Precio Unitario:</label>
                <input type="number" class="form-control" id="precio" step="0.01" min="0.01"
                    placeholder="Ingrese el precio" name="precio" required>
                <div class="invalid-feedback" id="error-precio"></div>
            </div>
            <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad Solicitada:</label>
                <input type="number" class="form-control" min="1" id="cantidad" min="1"
                    placeholder="Ingrese la cantidad" name="cantidad" required>
                <div class="invalid-feedback" id="error-cantidad"></div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <hr class="my-4">

        <div class="row g-2 align-items-start mb-3">
            <div class="col-md-4">
                <input type="number" class="form-control" id="precio-maximo" step="0.01" placeholder="Precio máximo">
                <div class="invalid-feedback" id="error-filtro"></div>
            </div>
            <div class="col-md-8 d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-primary" id="btn-filtrar">Filtrar productos</button>
                <button type="button" class="btn btn-outline-secondary" id="btn-todos">Mostrar todos</button>
                <button type="button" class="btn btn-outline-danger" id="btn-limpiar">Limpiar pedidos</button>
            </div>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Producto</th>
                    <th scope="col">Precio unitario</th>
                    <th scope="col">Cantidad</th>
                    <th scope="col">Subtotal</th>
                </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
            <tfoot>
                <tr>
                    <th scope="row" colspan="3">Totales</th>
                    <td id="cantidadT">0</td>
                    <td id="subtotalT">$0.00</td>
                </tr>
            </tfoot>
        </table>
    </main>
</body>

</html>
