<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/stylesFunciones.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Manejando Validaciones</title>
  </head>

  <body>
    <header>
      <div class="px-3 py-2 text-bg-dark fixed-top">
        <div class="container">
          <div
            class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"
          >
            <a
              href="../indexFunciones.html"
              class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none"
            >
              <img
                src="../img/js.png"
                alt=""
                width="32"
                height="32"
                class="me-2"
              />
            </a>

            <ul
              class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small nav-bar"
            >
              <li class="text-center">
                <a href="../indexFunciones.html" class="nav-link text-white">
                  <i class="bi bi-house-door bi-2 d-block"></i>
                  Regresar Inicio
                </a>
              </li>
              <li class="text-center">
                <a href="recursividad.html" class="nav-link text-white">
                  <i class="bi bi-arrow-clockwise bi-2 d-block"></i>
                  Recursividad
                </a>
              </li>
              <li class="text-center">
                <a href="tabla.html" class="nav-link text-white">
                  <i class="bi bi-table bi-2 d-block"></i>
                  Creando una Tabla
                </a>
              </li>
              <li class="text-center">
                <a href="formulario.html" class="nav-link text-white">
                  <i class="bi bi-ui-checks bi-2 d-block"></i>
                  Formulario
                </a>
              </li>
              <li class="text-center nav-bar-li-active">
                <a href="validaciones.html" class="nav-link text-white">
                  <i class="bi bi-shield-check bi-2 d-block"></i>
                  Validaciones
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <div class="container-lg">
      <div class="row">
        <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
          <h3>Validar Datos Estudiantes</h3>
          <form id="idForm">
            <div class="row">
              <div class="col-lg-6">
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="idCarnet"
                    placeholder="Carnet del Estudiante"
                  />
                  <label for="idCarnet">
                    <i class="bi bi-person-badge-fill"></i> Carnet
                  </label>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="idNombreCompleto"
                    placeholder="Nombre completo del Estudiantes"
                  />
                  <label for="idNombreCompleto">
                    <i class="bi bi-person-circle"></i> Nombre Completo
                  </label>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-lg-6">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="idDUI"
                    placeholder="DUI"
                    pattern="[0-9]{8}-[0-9]"
                    maxlength="10"
                  />
                  <label for="idDUI">
                    <i class="bi bi-person-bounding-box"></i> DUI
                  </label>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="idNIT"
                    placeholder="NIT"
                    pattern="[0-9]{3}-[0-9]{4}"
                  />
                  <label for="idNIT">
                    <i class="bi bi-person-bounding-box"></i> NIT
                  </label>
                </div>
              </div>
            </div>
            <div class="row pt-3">
              <div class="col-lg-4">
                <div class="form-floating">
                  <input
                    type="date"
                    class="form-control"
                    id="idFechaNacimiento"
                    placeholder="Fecha de nacimiento"
                    pattern="\d{2}-\d{2}-\d{4}"
                  />
                  <label for="idFechaNacimiento">
                    <i class="bi bi-calendar-date"></i> Fecha de Nacimiento
                  </label>
                </div>
              </div>
              <div class="col-lg-4">
                <div class="form-floating">
                  <input
                    type="email"
                    class="form-control"
                    id="idCorreo"
                    placeholder="Correo Electronico"
                  />
                  <label for="idCorreo">
                    <i class="bi bi-envelope-check"></i> Correo Electronico
                  </label>
                </div>
              </div>
              <div class="col-lg-4">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="idEdad"
                    placeholder="Edad"
                    maxlength="2"
                  />
                  <label for="idEdad">
                    <i class="bi bi-calendar-heart"></i> Edad
                  </label>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-lg-12 pt-3">
                <button id="idBtnAgregar" type="button" class="btn btn-success">
                  <i class="bi bi-person-plus-fill"></i> Guardar Datos
                </button>
                <button id="idBtnMostrar" type="button" class="btn btn-warning">
                  <i class="bi bi-people"></i> Mostrar personas
                </button>
                <button id="idBtnLimpiar" type="button" class="btn btn-danger">
                  <i class="bi bi-trash"></i> Limpiar formulario
                </button>
              </div>
            </div>
          </form>
        </div>
        <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
          <h3>Estudiantes registrados</h3>
          <div id="idTablaPacientes">Ninguno</div>
        </div>
      </div>
      <!-- PERMITE MOSTRAR NOTIFICACIONES -->
      <div
        class="toast-container top-0 start-50 translate-middle-x pt-4 mt-1"
        style="z-index: 1035"
      >
        <div
          id="idNotificacion"
          class="toast text-bg-success"
          role="alert"
          aria-live="assertive"
          aria-atomic="true"
        >
          <div class="toast-header">
            <i class="bi bi-bell"></i>
            <strong class="me-auto">Notificacion</strong>
            <small>Hace un momento</small>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="toast"
              aria-label="Close"
            ></button>
          </div>
          <div class="toast-body" id="idMensaje"></div>
        </div>
      </div>
    </div>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js" defer></script>
  </body>
</html>
